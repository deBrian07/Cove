<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; cursor: col-resize; }
      body.v { cursor: row-resize; }
      .bar { position: absolute; inset: 0; }
      .bar::after {
        content: "";
        position: absolute;
        left: 2px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(255, 255, 255, 0.35);
      }
      body.v .bar::after { left: 0; right: 0; top: 2px; bottom: auto; width: auto; height: 2px; }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.get('axis') === 'v') document.body.classList.add('v');
      let last = 0;
      window.addEventListener('mousedown', (event) => {
        last = params.get('axis') === 'v' ? event.screenY : event.screenX;
        const move = (ev) => {
          const point = params.get('axis') === 'v' ? ev.screenY : ev.screenX;
          const delta = point - last;
          last = point;
          if (!delta || !window.cove) return;
          window.cove.dispatch({
            type: 'divider-drag',
            id: params.get('id'),
            index: Number(params.get('index') || 0),
            delta,
          });
        };
        const up = () => window.removeEventListener('mousemove', move);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up, { once: true });
      });
    </script>
  </body>
</html>
