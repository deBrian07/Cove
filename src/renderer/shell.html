<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cove</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <div class="chrome" id="chrome">
      <nav class="rail" id="rail"></nav>
      <section class="side" id="side">
        <div class="nav" id="nav"></div>
        <div class="favs" id="favs"></div>
        <div class="list" id="list"></div>
        <div class="shelf" id="shelf"></div>
        <button class="plus" id="plus" type="button" title="New tab">+</button>
        <div class="resize" id="resize"></div>
      </section>
    </div>
    <header class="mini" id="mini" hidden></header>
    <div class="edge" id="edge"></div>
    <div class="editor" id="editor" hidden></div>
    <script src="./shell.js"></script>
  </body>
</html>
